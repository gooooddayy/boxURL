<!DOCTYPE html>
<html>
<body>
<pre id="jsonBox"></pre>
<script>
async function loadJson(){
  try{
    // 相对路径，单斜杠，不要写//
    const res = await fetch("./data.json")
    if(!res.ok){
      throw new Error("http错误："+res.status)
    }
    const data = await res.json()
    document.getElementById('jsonBox').innerText = JSON.stringify(data,null,2)
  }catch(err){
    document.getElementById('jsonBox').innerText = "读取出错："+err.message
    console.error(err)
  }
}
loadJson()
setInterval(loadJson,5000)
</script>
</body>
</html>
